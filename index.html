<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor de Video</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #000; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    .player-wrap { flex: 1; position: relative; background: #000; min-height: 0; }
    .player-wrap iframe, .player-wrap video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .bar { background: #111; border-top: 1px solid #222; padding: 0.6rem 1.2rem; display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; flex-wrap: wrap; }
    .tabs { display: flex; gap: 0.4rem; }
    .tabs button { background: #1a1a1a; color: #aaa; border: 1px solid #333; padding: 0.35rem 0.9rem; border-radius: 5px; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
    .tabs button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .sep { width: 1px; height: 1.5rem; background: #333; }
    .transcript-toggle { background: none; color: #aaa; border: 1px solid #333; padding: 0.35rem 0.9rem; border-radius: 5px; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
    .transcript-toggle.active { color: #fff; border-color: #555; }
    .panel { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(17,17,17,0.95); backdrop-filter: blur(10px); max-height: 45%; overflow-y: auto; padding: 1rem 1.5rem; line-height: 1.7; font-size: 0.9rem; white-space: pre-wrap; border-top: 1px solid #333; z-index: 10; }
    .panel.hidden { display: none; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="player-wrap">
    <iframe id="yt-player" src="https://www.youtube.com/embed/DlbFmmynHe4?feature=oembed" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <video id="r2-player" class="hidden" controls>
      <source src="https://cdnof.babm.cl/output.mp4" type="video/mp4">
      <track label="Subtítulos" srclang="es" src="https://cdnof.babm.cl/full.txt" default>
    </video>
    <div id="transcript-panel" class="panel hidden"><div id="transcript-text"></div></div>
  </div>
  <div class="bar">
    <div class="tabs">
      <button class="active" onclick="showSource('youtube')">YouTube</button>
      <button onclick="showSource('r2')">R2</button>
    </div>
    <div class="sep"></div>
    <button class="transcript-toggle" onclick="toggleTranscript()">Transcripción</button>
  </div>
  <script>
    function parseTime(str) {
      if (!str) return 0;
      if (str.includes(':')) {
        const p = str.split(':').map(Number);
        return p.length === 3 ? p[0]*3600+p[1]*60+p[2] : p[0]*60+p[1];
      }
      return parseInt(str,10)||0;
    }
    function showSource(src) {
      const yt = document.getElementById('yt-player');
      const r2 = document.getElementById('r2-player');
      const btns = document.querySelectorAll('.tabs button');
      btns.forEach(b=>b.classList.remove('active'));
      const t = parseTime(new URLSearchParams(location.search).get('t'));
      if (src==='youtube') {
        yt.classList.remove('hidden'); r2.classList.add('hidden');
        btns[0].classList.add('active');
        yt.src = 'https://www.youtube.com/embed/DlbFmmynHe4?feature=oembed'+(t?'&start='+t:'');
      } else {
        yt.classList.add('hidden'); r2.classList.remove('hidden');
        btns[1].classList.add('active');
        if(t) r2.currentTime=t;
      }
    }
    function toggleTranscript() {
      const p = document.getElementById('transcript-panel');
      const b = document.querySelector('.transcript-toggle');
      p.classList.toggle('hidden');
      b.classList.toggle('active');
    }
    const t = parseTime(new URLSearchParams(location.search).get('t'));
    if (t) document.getElementById('yt-player').src = 'https://www.youtube.com/embed/DlbFmmynHe4?feature=oembed&start='+t;
    fetch('https://cdnof.babm.cl/full.txt')
      .then(r=>r.text())
      .then(t=>{document.getElementById('transcript-text').textContent=t;})
      .catch(()=>{document.getElementById('transcript-text').textContent='No se pudo cargar la transcripción.';});
  </script>
</body>
</html>
